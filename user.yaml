
- name: create the user
  hosts: web
  become: yes
  tasks:
  - name: user exit or not
    ansible.builtin.command: id expense
    register: user
    ignore_error: true
  - name: print the user info
    ansible.builtin.debug:
     mesg: "user information: {{user}}"  
   
  - name: create the user
    ansible builtin.command: useradd expense
    when: user.rc!=0   