
- name: create the user
  hosts: web
  become: yes
  tasks:
  - name: check user exist or not
    ansible.builtin.command: id expense
    register: user
    ignore_errors: True
  - name: print the user info
    ansible.builtin.debug:
     msg: "user info: {{ user }}"  
   
  - name: create user
    ansible builtin.command: useradd expense
    when: USER.rc != 0  